name: Terraform workflow

# on:
#   workflow_dispatch:

on:
  push:
    branches:
      - main
jobs:
  terraform:
    if: ${{ !contains(github.event.head_commit.message, 'rollback') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Create GCP credentials file
        run: echo '${{ secrets.GCP_SA_KEY }}' > keys.json
      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
          TF_VAR_region: ${{ secrets.REGION }}
          TF_VAR_vpc_name: ${{ secrets.VPC_NAME }}
          TF_VAR_subnet_name: ${{ secrets.SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ secrets.SUBNET_CIDR }}
          TF_VAR_vm_name: ${{ secrets.VM_NAME }}
          TF_VAR_machine_type: ${{ secrets.MACHINE_TYPE }}
          TF_VAR_zone: ${{ secrets.ZONE }}
          TF_VAR_image: ${{ secrets.IMAGE }}
          TF_VAR_disk_type: ${{ secrets.DISK_TYPE }}
          TF_VAR_disk_size: ${{ secrets.DISK_SIZE }}
      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
          TF_VAR_region: ${{ secrets.REGION }}
          TF_VAR_vpc_name: ${{ secrets.VPC_NAME }}
          TF_VAR_subnet_name: ${{ secrets.SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ secrets.SUBNET_CIDR }}
          TF_VAR_vm_name: ${{ secrets.VM_NAME }}
          TF_VAR_machine_type: ${{ secrets.MACHINE_TYPE }}
          TF_VAR_zone: ${{ secrets.ZONE }}
          TF_VAR_image: ${{ secrets.IMAGE }}
          TF_VAR_disk_type: ${{ secrets.DISK_TYPE }}
          TF_VAR_disk_size: ${{ secrets.DISK_SIZE }}
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_id: ${{ secrets.PROJECT_ID }}
          TF_VAR_region: ${{ secrets.REGION }}
          TF_VAR_vpc_name: ${{ secrets.VPC_NAME }}
          TF_VAR_subnet_name: ${{ secrets.SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ secrets.SUBNET_CIDR }}
          TF_VAR_vm_name: ${{ secrets.VM_NAME }}
          TF_VAR_machine_type: ${{ secrets.MACHINE_TYPE }}
          TF_VAR_zone: ${{ secrets.ZONE }}
          TF_VAR_image: ${{ secrets.IMAGE }}
          TF_VAR_disk_type: ${{ secrets.DISK_TYPE }}
          TF_VAR_disk_size: ${{ secrets.DISK_SIZE }}
      - name: Remove credentials file
        if: always()
        working-directory: ./terraform
        run: rm -f keys.json